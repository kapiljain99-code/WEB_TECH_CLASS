<!DOCTYPE html>
<html>
<head>
    <title>Login & Register</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .box {
            width: 350px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            animation: fadeIn 0.6s ease;
        }

        h2 {
            margin-bottom: 15px;
            color: #38bdf8;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: white;
            transition: 0.3s;
        }

        input:focus {
            background: rgba(255,255,255,0.2);
            transform: scale(1.02);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(45deg, #38bdf8, #0ea5e9);
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #38bdf8;
        }

        .toggle {
            margin-top: 15px;
            cursor: pointer;
            color: #facc15;
            transition: 0.3s;
        }

        .toggle:hover {
            text-decoration: underline;
            transform: scale(1.05);
        }

        .hidden {
            display: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        
        .box:hover {
            box-shadow: 0 0 40px rgba(56,189,248,0.5);
        }

        
        form {
            animation: slide 0.4s ease;
        }

        @keyframes slide {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

    </style>

    <script>
        function showRegister() {
            document.getElementById("loginForm").classList.add("hidden");
            document.getElementById("registerForm").classList.remove("hidden");
        }

        function showLogin() {
            document.getElementById("registerForm").classList.add("hidden");
            document.getElementById("loginForm").classList.remove("hidden");
        }

        function validateRegister() {
            let name = document.getElementById("rname").value;
            let email = document.getElementById("remail").value;
            let password = document.getElementById("rpass").value;

            if (name === "" || email === "" || password === "") {
                alert("All fields required!");
                return false;
            }

            if (!email.includes("@")) {
                alert("Invalid email!");
                return false;
            }

            if (password.length < 6) {
                alert("Password must be 6+ characters!");
                return false;
            }

            alert("Registered Successfully!");
            return false;
        }

        function validateLogin() {
            let email = document.getElementById("lemail").value;
            let password = document.getElementById("lpass").value;

            if (email === "" || password === "") {
                alert("All fields required!");
                return false;
            }

            if (!email.includes("@")) {
                alert("Invalid email!");
                return false;
            }

            alert("Login Successful!");
            return false;
        }
    </script>
</head>

<body>

<div class="box">

    <!-- LOGIN -->
    <div id="loginForm">
        <h2>Login</h2>
        <form onsubmit="return validateLogin()">
            <input type="text" id="lemail" placeholder="Email">
            <input type="password" id="lpass" placeholder="Password">
            <button type="submit">Login</button>
        </form>

        <p class="toggle" onclick="showRegister()">Create Account</p>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" class="hidden">
        <h2>Register</h2>
        <form onsubmit="return validateRegister()">
            <input type="text" id="rname" placeholder="Name">
            <input type="text" id="remail" placeholder="Email">
            <input type="password" id="rpass" placeholder="Password">
            <button type="submit">Register</button>
        </form>

        <p class="toggle" onclick="showLogin()">Already have account?</p>
    </div>

</div>

</body>
</html>
